admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9902

static_resources:
  listeners:
    - name: org_a_egress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 12000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: org_a_egress
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          start_time: "%START_TIME%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          duration_ms: "%DURATION%"
                route_config:
                  name: org_a_egress_routes
                  virtual_hosts:
                    - name: egress_decision
                      domains: ["*"]
                      routes:
                        - match:
                            path: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok"}'
                          response_headers_to_add:
                            - header:
                                key: content-type
                                value: application/json
                        - match:
                            path: "/api/badge-scope-check"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"decision":"ALLOW","boundary":"org-a-badge-scope"}'
                          response_headers_to_add:
                            - header:
                                key: content-type
                                value: application/json
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"decision":"ALLOW","boundary":"org-a-egress"}'
                          response_headers_to_add:
                            - header:
                                key: content-type
                                value: application/json
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        idjag_actor_token:
                          # Keycloak A itself now mints this assertion (see
                          # keycloak-idjag-spi/) instead of the separate
                          # idjag-issuer mock — issuer/JWKS point at
                          # Keycloak A's own realm, matching
                          # Urls.realmIssuer(...) in
                          # IdJagTokenExchangeProvider. Assumes
                          # KC_A_RELATIVE_PATH is unset (default "/"); if a
                          # deployment sets it, this issuer/uri need the same
                          # prefix.
                          issuer: http://keycloak-a:8080/realms/org-a
                          # /keycloak-b matches KC_B_RELATIVE_PATH on the
                          # keycloak-b service (docker-compose.yaml) — this
                          # must equal the "aud" the ID-JAG was minted with
                          # (KC_B_ISSUER, derived from KC_B_URL there).
                          audiences:
                            - http://keycloak-b:8080/keycloak-b/realms/org-b
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak-a:8080/realms/org-a/protocol/openid-connect/certs
                              cluster: keycloak_a_jwks
                              timeout: 5s
                            cache_duration: 300s
                          forward: false
                          forward_payload_header: x-verified-actor-token-payload
                        kc_a_access_token:
                          issuer: http://keycloak-a:8080/realms/org-a
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak-a:8080/realms/org-a/protocol/openid-connect/certs
                              cluster: keycloak_a_jwks
                              timeout: 5s
                            cache_duration: 300s
                          forward: false
                          forward_payload_header: x-verified-user-token-payload
                      rules:
                        - match:
                            path: "/health"
                        - match:
                            path: "/api/badge-scope-check"
                          requires:
                            provider_name: kc_a_access_token
                        - match:
                            prefix: "/"
                          requires:
                            provider_name: idjag_actor_token
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 65536
                  - name: io.builtonenvoy.opa
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: composer
                      filter_name: opa
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"policies":[{"file":"/etc/envoy/policies/egress.rego"}],"with_body":true,"fail_open":false}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Shared by both jwt_authn providers: the ID-JAG is now minted natively
    # by Keycloak A (keycloak-idjag-spi), and the badge-scope route verifies
    # Sarah's KC-A access token — one JWKS endpoint serves both.
    - name: keycloak_a_jwks
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: keycloak_a_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: keycloak-a
                      port_value: 8080
