admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9902

static_resources:
  listeners:
    - name: org_a_egress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 12000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: org_a_egress
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          start_time: "%START_TIME%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          duration_ms: "%DURATION%"
                route_config:
                  name: org_a_egress_routes
                  virtual_hosts:
                    - name: egress_decision
                      domains: ["*"]
                      routes:
                        - match:
                            path: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok"}'
                          response_headers_to_add:
                            - header:
                                key: content-type
                                value: application/json
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"decision":"ALLOW","boundary":"org-a-egress"}'
                          response_headers_to_add:
                            - header:
                                key: content-type
                                value: application/json
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        idjag_actor_token:
                          issuer: http://idjag-issuer:9000
                          audiences:
                            - http://keycloak-b:8080/realms/org-b
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          remote_jwks:
                            http_uri:
                              uri: http://idjag-issuer:9000/jwks
                              cluster: idjag_issuer_jwks
                              timeout: 5s
                            cache_duration: 300s
                          forward: false
                          forward_payload_header: x-verified-actor-token-payload
                      rules:
                        - match:
                            path: "/health"
                        - match:
                            prefix: "/"
                          requires:
                            requires_all:
                              requirements:
                                - provider_name: idjag_actor_token
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 65536
                  - name: io.builtonenvoy.opa
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: composer
                      filter_name: opa
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"policies":[{"file":"/etc/envoy/policies/egress.rego"}],"with_body":true,"fail_open":false}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: idjag_issuer_jwks
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: idjag_issuer_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: idjag-issuer
                      port_value: 9000
