name: cross-domain-stack

# Cross-domain agent remediation demo — sequence diagram:
#   local scan → discovery → cross-domain token exchange → inline OPA PDP
#   (egress + ingress + resource) → sub-agent spawn → Gitea PR audit
#
# Actors from the diagram:
#   Sarah          → demo user (Org A), signs in via Keycloak A
#   OpenCode       → Org A AI agent: REAL OpenCode (opencode-server, headless)
#                    + identity harness (opencode-agent), task lifecycle:
#                    OAuth → identity → policy-scoped badge → work → delegate
#   AGNTCY         → identity node (CIMD) + vc-issuer (badge mint) + idjag-issuer (assertion mint)
#   Keycloak A     → Org A IdP (org-a realm), authenticates Sarah
#   Envoy+OPA A    → egress inline policy (may Sarah delegate this scope to Org B?)
#   Keycloak B     → Org B IdP (org-b realm), receives cross-domain ID-JAG assertion
#   Envoy+OPA B    → ticket-ingress + resource-access inline policies
#   Triage         → Org B remediation agent (mock), steps 13-19
#   Sub-Agent      → Org B sub-agent (mock, bounded privilege), steps 20-25
#   Gitea          → resource (repository for PRs)
#
# Ports (non-conflicting with single-org-id-jag-app-access defaults):
#   keycloak-a      → host:8082  (Org A IdP)
#   keycloak-b      → host:8083  (Org B IdP)
#   vc-issuer       → host:9003  (AGNTCY badge minter, stand-in for identity-node's badge API)
#   idjag-issuer    → host:9002  (AGNTCY assertion minter)
#   identity-node   → host:4005 (REST) / 4006 (gRPC)
#   gitea           → host:3002
#   envoy-org-a     → host:12000 (egress)  admin:127.0.0.1:9902
#   envoy-org-b     → host:10000 (ticket ingress) / 10001 (resource access)
#                     admin:127.0.0.1:9901
#   opencode-agent  → host:8100  (Org A identity harness for real OpenCode)
#   opencode-server → internal :4096 (real OpenCode, headless)
#   triage-agent    → internal only (behind Envoy)
#   sub-agent       → host:8300  (Org B sub-agent)
#   jaeger          → host:16686 (trace UI; every service exports via OTLP)
#
# Quick start:
#   cp .env.example .env          # edit the change-me-* values
#   docker compose up -d
#   curl http://localhost:8100/api/run   # trigger the full sequence
#   open http://localhost:16686           # view the resulting trace

services:

  # ---------------------------------------------------------------------------
  # Jaeger — OpenTelemetry trace backend (all-in-one: collector + UI + storage)
  #   - Every Python service exports spans here via OTLP (OTEL_EXPORTER_OTLP_
  #     ENDPOINT=http://jaeger:4317); httpx calls carry the W3C traceparent
  #     header automatically, so one browser-triggered run produces one
  #     continuous trace across every hop, including through Envoy (a plain
  #     proxy that forwards the header unmodified — no Envoy-side tracing
  #     filter configured, so Envoy hops themselves aren't separate spans)
  #   - UI: http://localhost:16686
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: cd-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Only needed when reverse-proxying the UI under a subpath (e.g. a
      # deployment that fronts everything with its own TLS/auth gate);
      # leave unset for local use, where Jaeger is reached directly at "/".
      QUERY_BASE_PATH: ${JAEGER_QUERY_BASE_PATH:-}
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    networks:
      - cd-net
      - resource-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:14269/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Keycloak A — Org A IdP (realm: org-a)
  #   - Authenticates Sarah (password grant → opencode-agent client)
  #   - ID-JAG IdP wired to idjag-issuer's JWKS
  #   - standard.token.exchange enabled on opencode-agent (RFC 8693, step 7)
  # ---------------------------------------------------------------------------
  keycloak-a:
    # Keycloak 26.7 + the keycloak-idjag-spi provider baked in (native
    # ID-JAG issuance via grant_type=token-exchange — see
    # keycloak-idjag-spi/ and https://github.com/agntcy/agent-identity-demos/discussions/18).
    # Build context is this whole directory (not keycloak-a/) so the
    # Dockerfile can reach the sibling keycloak-idjag-spi/ Maven module.
    build:
      context: .
      dockerfile: keycloak-a/Dockerfile
    image: cd-keycloak-a-idjag
    container_name: cd-keycloak-a
    command: >
      start-dev --import-realm
      --features=identity-assertion-jwt,token-exchange-delegation,parameterized-scopes
      --http-relative-path=${KC_A_RELATIVE_PATH:-/}
      --proxy-headers=xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_A_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_A_ADMIN_PASSWORD:?set KC_A_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8080
    ports:
      - "${KC_A_HTTP_PORT:-8082}:8080"
    volumes:
      - ./keycloak-a:/opt/keycloak/data/import:ro
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo OK || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # One-shot: register triage:create optional scope on opencode-agent in org-a
  kc-a-init:
    image: quay.io/keycloak/keycloak:26.7
    container_name: cd-kc-a-init
    entrypoint: bash /bootstrap-scopes.sh
    depends_on:
      keycloak-a:
        condition: service_healthy
    environment:
      KC_URL: ${KC_A_INTERNAL_URL:-http://keycloak-a:8080}
      KC_REALM: org-a
      KC_ADMIN: ${KC_A_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KC_A_ADMIN_PASSWORD:?set KC_A_ADMIN_PASSWORD in .env}
      REQUESTER_CLIENT: opencode-agent
    volumes:
      - ./keycloak-a/bootstrap-scopes.sh:/bootstrap-scopes.sh:ro
    networks:
      - cd-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # Keycloak B — Org B IdP (realm: org-b)
  #   - Receives cross-domain ID-JAG assertions from OpenCode (jwt-bearer grant)
  #   - Issues scoped access tokens to triage-agent (triage:create) and sub-agent (gitea:*)
  #   - Sarah's identity propagated via federated ID link (id-jag IdP)
  # ---------------------------------------------------------------------------
  keycloak-b:
    # Built with keycloak-idjag-spi baked in (see keycloak-b/Dockerfile) —
    # Org B mints the narrowed Triage → Sub-Agent sub-badge natively via a
    # real token-exchange call, mirroring Keycloak A's native ID-JAG mint.
    build:
      context: .
      dockerfile: keycloak-b/Dockerfile
    image: cd-keycloak-b-idjag
    container_name: cd-keycloak-b
    command: >
      start-dev --import-realm
      --features=identity-assertion-jwt,token-exchange-delegation,parameterized-scopes
      --http-relative-path=${KC_B_RELATIVE_PATH:-/}
      --proxy-headers=xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_B_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_B_ADMIN_PASSWORD:?set KC_B_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8080
    ports:
      - "${KC_B_HTTP_PORT:-8083}:8080"
    volumes:
      - ./keycloak-b:/opt/keycloak/data/import:ro
    networks:
      - cd-net
      - resource-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo OK || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # One-shot: register triage:create / gitea:* optional scopes in org-b
  kc-b-init:
    image: quay.io/keycloak/keycloak:26.7
    container_name: cd-kc-b-init
    entrypoint: bash /bootstrap-scopes.sh
    depends_on:
      keycloak-b:
        condition: service_healthy
    environment:
      KC_URL: ${KC_B_INTERNAL_URL:-http://keycloak-b:8080}
      KC_REALM: org-b
      KC_ADMIN: ${KC_B_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KC_B_ADMIN_PASSWORD:?set KC_B_ADMIN_PASSWORD in .env}
    volumes:
      - ./keycloak-b/bootstrap-scopes.sh:/bootstrap-scopes.sh:ro
    networks:
      - cd-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # VC badge issuer — stand-in for identity-node's (nonexistent) badge API
  #   - Generates ephemeral RSA key pair at startup; publishes JWKS at /jwks
  #   - Steps 3-6: OpenCode calls POST /vc/issue then POST /vc/verify to
  #     resolve and self-check its own delegation badge
  #   - identity-node (below) only does CIMD id generate/resolve; it has no
  #     badge concept, so this stays a separate demo helper
  # ---------------------------------------------------------------------------
  vc-issuer:
    build:
      context: ./vc-issuer
    image: cd-vc-issuer
    container_name: cd-vc-issuer
    depends_on:
      jaeger:
        condition: service_healthy
    environment:
      ISSUER_URL: http://vc-issuer:9003
      BADGE_TTL: ${BADGE_TTL:-3600}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${VC_ISSUER_PORT:-9003}:9003"
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9003/healthz').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # ID-JAG issuer — AGNTCY assertion minter (trusted by both Keycloak A and B)
  #   - Generates ephemeral RSA key pair at startup; publishes JWKS at /jwks
  #   - Both KC-A and KC-B configure an id-jag IdP pointing at this JWKS URL
  #   - Mints assertions for:
  #       step  8: OpenCode → Triage cross-domain (aud=KC-B org-b realm)
  #       step 17: Triage → Sub-Agent sub-badge   (aud=KC-B org-b realm, nested act_chain)
  # ---------------------------------------------------------------------------
  idjag-issuer:
    build:
      context: ../archive/single-org-id-jag-app-access/idjag-issuer
    image: cd-idjag-issuer
    container_name: cd-idjag-issuer
    depends_on:
      jaeger:
        condition: service_healthy
    environment:
      ISSUER_URL: http://idjag-issuer:9000
      ASSERTION_TTL: ${ASSERTION_TTL:-300}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${IDJAG_PORT:-9002}:9000"
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/healthz').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # AGNTCY Identity Node infrastructure (Postgres + Vault + Node)
  #   - Badge (VC) registry and resolver
  #   - Steps 3-6: OpenCode would call /vc/verify here (mocked in agent stub)
  #   - Points at Keycloak A (Org A) as its OIDC issuer for tenant auth
  # ---------------------------------------------------------------------------
  identity-postgres:
    image: postgres:16
    container_name: cd-identity-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-identity}
    volumes:
      - cd-identity-postgres-data:/var/lib/postgresql/data
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-vault:
    image: hashicorp/vault:1.17
    container_name: cd-identity-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-node:
    image: ghcr.io/agntcy/identity/node:0.0.23
    container_name: cd-identity-node
    pull_policy: always
    depends_on:
      identity-postgres:
        condition: service_healthy
      identity-vault:
        condition: service_healthy
    ports:
      - "${IDENTITY_NODE_REST_PORT:-4005}:4000"
      - "${IDENTITY_NODE_GRPC_PORT:-4006}:4001"
    environment:
      DB_HOST: identity-postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-identity}
      VAULT_HOST: identity-vault
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      GO_ENV: development
      LOG_LEVEL: DebugLevel
      IAM_ORGANIZATION: ${IAM_ORGANIZATION:-cross-domain-demo}
      SECRETS_CRYPTO_KEY: ${SECRETS_CRYPTO_KEY:?set SECRETS_CRYPTO_KEY in .env}
      # Keycloak A is the OIDC issuer for Org A agents registering badges
      IAM_ISSUER: ${KC_A_INTERNAL_URL:-http://keycloak-a:8080}/realms/org-a
      IAM_USER_CID: opencode-agent
      IAM_USER_CID_CLAIM_NAME: azp
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4000 && nc -z 127.0.0.1 4001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Gitea — the protected resource (repository server)
  # ---------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:1.22
    container_name: cd-gitea
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3002/}
      GITEA__server__HTTP_PORT: 3000
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      USER_UID: 1000
      USER_GID: 1000
    volumes:
      - cd-gitea-data:/data
    ports:
      - "${GITEA_HTTP_PORT:-3002}:3000"
      - "${GITEA_SSH_PORT:-2223}:22"
    networks:
      - cd-net
      - resource-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  gitea-init:
    image: gitea/gitea:1.22
    container_name: cd-gitea-init
    entrypoint: sh /init.sh
    user: git
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-demo-admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?set GITEA_ADMIN_PASSWORD in .env}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - cd-gitea-data:/data
      - ./gitea/init.sh:/init.sh:ro
    networks:
      - cd-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # Gitea gateway — enforces Org B narrow scoping in front of Gitea
  #   - Validates tokens issued by Keycloak B (org-b realm) via JWKS
  #   - Scope enforcement: gitea:read / gitea:write / gitea:pr
  #   - Policy deny-list: demo-protected is always blocked for PR creation
  #   - Internal-only; Sub-Agent traffic must traverse envoy-org-b:10001
  # ---------------------------------------------------------------------------
  gitea-gateway:
    build:
      context: ../archive/single-org-id-jag-app-access/gitea-gateway
    image: cd-gitea-gateway
    container_name: cd-gitea-gateway
    depends_on:
      keycloak-b:
        condition: service_healthy
      gitea:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      # Validate tokens against Keycloak B (Org B)
      KEYCLOAK_URL: ${KC_B_INTERNAL_URL:-http://keycloak-b:8080}
      KEYCLOAK_REALM: org-b
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-demo-admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?set GITEA_ADMIN_PASSWORD in .env}
      GITEA_READ_SCOPE: gitea:read
      GITEA_WRITE_SCOPE: gitea:write
      GITEA_PR_SCOPE: gitea:pr
      GITEA_DENY_LIST: demo-protected
      REQUIRE_ENVOY_POLICY: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    networks:
      - resource-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Org A gateway — Envoy + Built On Envoy inline OPA dynamic module
  #   - Listener 12000 enforces the egress PDP: may Sarah delegate this scope
  #     to Org B? Verifies the freshly-minted ID-JAG against idjag-issuer's
  #     JWKS, then checks scope/intent/delegation-chain in Rego before
  #     OpenCode redeems it at Keycloak B.
  # ---------------------------------------------------------------------------
  envoy-org-a:
    build:
      context: ./envoy-org-a
      pull: true
      args:
        BOE_COMPOSER_IMAGE: ${BOE_COMPOSER_IMAGE:-ghcr.io/tetratelabs/built-on-envoy/composer:0.11.0-dev@sha256:842fca7db63af7385478380bf097c6e85eb16db7158a88778d6f2018b265d84f}
        ENVOY_IMAGE: ${ENVOY_BASE_IMAGE:-envoyproxy/envoy:v1.38.3@sha256:5f7c43e1147412fdb3af578c651c67478a3df818eae89d2261e707e06c209cdb}
    image: cd-envoy-boe-a:${ENVOY_A_IMAGE_TAG:-milestone4}
    container_name: cd-envoy-org-a
    depends_on:
      idjag-issuer:
        condition: service_healthy
      # badge-scope route verifies Sarah's KC-A access token via KC-A JWKS
      keycloak-a:
        condition: service_healthy
    ports:
      - "${ENVOY_A_EGRESS_PORT:-12000}:12000"
      - "127.0.0.1:${ENVOY_A_ADMIN_PORT:-9902}:9902"
    networks:
      - cd-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9902"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Org B gateway — Envoy + Built On Envoy inline OPA dynamic module
  #   - Listener 10000 proxies cross-domain ticket requests to Triage
  #   - Listener 10001 enforces Sub-Agent resource access before Gitea Gateway
  #   - Both paths verify an Org B access token plus the original ID-JAG actor
  #     token, then enforce delegation, scope, intent, and resource in Rego
  # ---------------------------------------------------------------------------
  envoy-org-b:
    build:
      context: ./envoy
      pull: true
      args:
        BOE_COMPOSER_IMAGE: ${BOE_COMPOSER_IMAGE:-ghcr.io/tetratelabs/built-on-envoy/composer:0.11.0-dev@sha256:842fca7db63af7385478380bf097c6e85eb16db7158a88778d6f2018b265d84f}
        ENVOY_IMAGE: ${ENVOY_BASE_IMAGE:-envoyproxy/envoy:v1.38.3@sha256:5f7c43e1147412fdb3af578c651c67478a3df818eae89d2261e707e06c209cdb}
    image: cd-envoy-boe:${ENVOY_IMAGE_TAG:-milestone3}
    container_name: cd-envoy-org-b
    depends_on:
      keycloak-b:
        condition: service_healthy
      idjag-issuer:
        condition: service_healthy
      triage-agent:
        condition: service_healthy
      gitea-gateway:
        condition: service_healthy
    ports:
      - "${ENVOY_TICKET_PORT:-10000}:10000"
      - "${ENVOY_RESOURCE_PORT:-10001}:10001"
      - "127.0.0.1:${ENVOY_ADMIN_PORT:-9901}:9901"
    networks:
      - cd-net
      - resource-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # OpenCode Server — the REAL OpenCode coding agent (opencode.ai), headless
  #   - Pinned npm release opencode-ai@1.18.7, `opencode serve` on :4096
  #   - Model provider: host Ollama by default (OPENCODE_MODEL=ollama/...,
  #     via host.docker.internal) or Anthropic (ANTHROPIC_API_KEY passthrough)
  #   - Read-only for the demo: `plan` agent + permission edit/bash deny
  #   - Internal-only on cd-net; driven by opencode-agent (identity harness)
  # ---------------------------------------------------------------------------
  opencode-server:
    build:
      context: ./opencode-server
    image: cd-opencode-server
    container_name: cd-opencode-server
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-ollama/qwen2.5-coder:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4096/global/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # OpenCode Agent — Org A identity harness for the real OpenCode agent
  #   Task lifecycle (per delegated task from Sarah):
  #     1     Sarah OIDC → Keycloak A → delegated access token
  #     2-3   OpenCode registers its own identity (CIMD @ identity-node)
  #     4     badge request → Envoy A + OPA → scoped-down intent
  #     5     vc-issuer mints the task-scoped badge
  #     6-6b  work: mock scan + real OpenCode remediation plan
  #     7-8   Directory turn record + triage-agent discovery
  #     9-12  RFC 8693 → ID-JAG → egress OPA → KC-B → ticket to Org B
  #
  # Trigger: POST http://localhost:8100/api/run
  # ---------------------------------------------------------------------------
  opencode-agent:
    build:
      context: ./opencode-agent
      additional_contexts:
        dir_proto: ./proto
        shared_lib: ./agntcy_identity_client
    image: cd-opencode-agent
    container_name: cd-opencode-agent
    depends_on:
      keycloak-a:
        condition: service_healthy
      keycloak-b:
        condition: service_healthy
      vc-issuer:
        condition: service_healthy
      idjag-issuer:
        condition: service_healthy
      envoy-org-a:
        condition: service_healthy
      envoy-org-b:
        condition: service_healthy
      opencode-server:
        condition: service_healthy
      identity-node:
        condition: service_healthy
      identity-vault:
        condition: service_healthy
      identity-node-init:
        condition: service_completed_successfully
      dir-apiserver:
        condition: service_started
      jaeger:
        condition: service_healthy
    ports:
      - "${OPENCODE_PORT:-8100}:8100"
    environment:
      # Org A IdP — Sarah's login
      KC_A_URL: ${KC_A_INTERNAL_URL:-http://keycloak-a:8080}
      KC_A_REALM: org-a
      OPENCODE_CLIENT_ID: opencode-agent
      OPENCODE_CLIENT_SECRET: ${OPENCODE_CLIENT_SECRET:-demo-opencode-secret-change-me}
      SARAH_USER: ${SARAH_USER:-sarah}
      SARAH_PASSWORD: ${SARAH_PASSWORD:?set SARAH_PASSWORD in .env}
      SARAH_EMAIL: ${SARAH_EMAIL:-sarah@org-a.example}
      # Org B IdP — receives cross-domain assertion
      KC_B_URL: ${KC_B_INTERNAL_URL:-http://keycloak-b:8080}
      KC_B_REALM: org-b
      TRIAGE_CLIENT_ID: triage-agent
      TRIAGE_CLIENT_SECRET: ${TRIAGE_CLIENT_SECRET:-demo-triage-secret-change-me}
      # AGNTCY services
      VC_ISSUER_URL: http://vc-issuer:9003
      IDJAG_ISSUER_URL: http://idjag-issuer:9000
      IDENTITY_NODE_URL: http://identity-node:4000
      DIR_APISERVER_URL: dir-apiserver:8888
      # CIMD proof signing — org-a trust authority key in Vault Transit
      VAULT_ADDR: http://identity-vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      VAULT_KEY_NAME: org-a-issuer
      ORG_A_COMMON_NAME: org-a
      # Org A trust boundary; Envoy enforces badge scoping + the egress PDP.
      EGRESS_PDP_URL: http://envoy-org-a:12000
      # Org B trust boundary; Envoy proxies the request to Triage.
      TRIAGE_AGENT_URL: http://envoy-org-b:10000
      # Real OpenCode (headless) + model provider
      OPENCODE_SERVER_URL: http://opencode-server:4096
      OPENCODE_MODEL: ${OPENCODE_MODEL:-ollama/qwen2.5-coder:7b}
      OPENCODE_TIMEOUT: ${OPENCODE_TIMEOUT:-240}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Default scan target
      SCAN_REPO: ${SCAN_REPO:-demo-admin/payments-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Triage Agent (mock) — Org B remediation agent
  #   Steps 13-19: receive policy-approved ticket → plan → mint sub-badge → spawn sub-agent
  #
  # Reachable only on cd-net; OpenCode must enter through envoy-org-b.
  # ---------------------------------------------------------------------------
  triage-agent:
    build:
      context: ./triage-agent
      additional_contexts:
        dir_proto: ./proto
        shared_lib: ./agntcy_identity_client
    image: cd-triage-agent
    container_name: cd-triage-agent
    depends_on:
      keycloak-a:
        condition: service_healthy
      keycloak-b:
        condition: service_healthy
      sub-agent:
        condition: service_started
      identity-node:
        condition: service_healthy
      identity-vault:
        condition: service_healthy
      identity-node-init:
        condition: service_completed_successfully
      dir-apiserver:
        condition: service_started
      jaeger:
        condition: service_healthy
    environment:
      # Keycloak A JWKS — for in-agent verification of the inbound ID-JAG
      KC_A_URL: ${KC_A_INTERNAL_URL:-http://keycloak-a:8080}
      KC_A_REALM: org-a
      KC_B_URL: ${KC_B_INTERNAL_URL:-http://keycloak-b:8080}
      KC_B_REALM: org-b
      TRIAGE_CLIENT_ID: triage-agent
      TRIAGE_CLIENT_SECRET: ${TRIAGE_CLIENT_SECRET:-demo-triage-secret-change-me}
      SUB_AGENT_CLIENT_ID: sub-agent
      IDENTITY_NODE_URL: http://identity-node:4000
      DIR_APISERVER_URL: dir-apiserver:8888
      # CIMD proof signing — org-b trust authority key in Vault Transit
      VAULT_ADDR: http://identity-vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      VAULT_KEY_NAME: org-b-issuer
      ORG_COMMON_NAME: org-b
      # Org B PDP — sub-badge narrowing decided by Envoy B + inline OPA
      SUBBADGE_PDP_URL: http://envoy-org-b:10000
      SUB_AGENT_URL: http://sub-agent:8300
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Sub-Agent (mock) — Org B, bounded privilege
  #   Steps 20-25: jwt-bearer exchange → Envoy OPA → push file → open PR → PR created
  #
  # Spawned by Triage with a narrowed sub-badge carrying:
  #   - caps ⊆ parent (gitea:write gitea:pr only, no triage:create)
  #   - nested act-chain: Sarah → OpenCode → Triage → Sub-Agent
  #   - signed intent=create-pr-fix and resource=the exact target repository
  # ---------------------------------------------------------------------------
  sub-agent:
    build:
      context: ./sub-agent
    image: cd-sub-agent
    container_name: cd-sub-agent
    depends_on:
      keycloak-b:
        condition: service_healthy
      idjag-issuer:
        condition: service_healthy
      gitea-gateway:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    ports:
      - "${SUB_AGENT_PORT:-8300}:8300"
    environment:
      KC_B_URL: ${KC_B_INTERNAL_URL:-http://keycloak-b:8080}
      KC_B_REALM: org-b
      SUB_AGENT_CLIENT_ID: sub-agent
      SUB_AGENT_CLIENT_SECRET: ${SUB_AGENT_CLIENT_SECRET:-demo-subagent-secret-change-me}
      IDJAG_ISSUER_URL: http://idjag-issuer:9000
      # Org B resource boundary; direct Gitea Gateway access is not exposed.
      GITEA_GATEWAY_URL: http://envoy-org-b:10001
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-demo-admin}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # AGNTCY Directory Node — content-addressed agent VC registry
  #   - Stores OASF agent records (opencode-agent, triage-agent, sub-agent)
  #   - Per-turn record push from webapp (step 3: dir-push)
  #   - Agent discovery by name (step 4: dir-search)
  # ---------------------------------------------------------------------------
  dir-postgres:
    image: postgres:16
    container_name: cd-dir-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DIR_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: directory
    volumes:
      - cd-dir-postgres-data:/var/lib/postgresql/data
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  dir-zot:
    image: ghcr.io/project-zot/zot:v2.1.17
    container_name: cd-dir-zot
    volumes:
      - ./dir/zot-config.json:/etc/zot/config.json:ro
      - cd-dir-zot-data:/var/lib/registry
    ports:
      - "${DIR_ZOT_PORT:-5556}:5000"
    networks:
      - cd-net
    # zot is a distroless image (no shell/wget/nc) — cannot exec a CMD-SHELL
    # probe, so dependents key off service_started instead of service_healthy.

  dir-apiserver:
    image: ghcr.io/agntcy/dir-apiserver:v1.6.0
    container_name: cd-dir-apiserver
    pull_policy: always
    depends_on:
      dir-postgres:
        condition: service_healthy
      dir-zot:
        condition: service_started
    ports:
      - "${DIR_APISERVER_PORT:-8888}:8888"
    environment:
      DIRECTORY_SERVER_LISTEN_ADDRESS: 0.0.0.0:8888
      DIRECTORY_SERVER_STORE_OCI_REGISTRY_ADDRESS: dir-zot:5000
      DIRECTORY_SERVER_STORE_OCI_REPOSITORY_NAME: dir
      DIRECTORY_SERVER_DATABASE_POSTGRES_HOST: dir-postgres
      DIRECTORY_SERVER_DATABASE_POSTGRES_PORT: 5432
      DIRECTORY_SERVER_DATABASE_POSTGRES_DATABASE: directory
      DIRECTORY_SERVER_DATABASE_POSTGRES_USERNAME: postgres
      DIRECTORY_SERVER_DATABASE_POSTGRES_PASSWORD: ${DIR_POSTGRES_PASSWORD:-postgres}
      DIRECTORY_SERVER_ROUTING_LISTEN_ADDRESS: /ip4/0.0.0.0/tcp/8999
      DIRECTORY_SERVER_AUTHN_ENABLED: "false"
      DIRECTORY_SERVER_AUTHZ_ENABLED: "false"
      # schema.oasf.agntcy.org is unresolvable from this sandbox's egress;
      # schema.oasf.outshift.com is Cisco Outshift's mirror of the same OASF schema service.
      DIRECTORY_SERVER_OASF_API_VALIDATION_SCHEMA_URL: https://schema.oasf.outshift.com
    networks:
      - cd-net
    # distroless image (no shell/nc) — cannot exec a CMD-SHELL probe;
    # dependents key off service_started instead of service_healthy.
    #
    # Note: ghcr.io/agntcy/dir-ctl is the `dirctl` one-shot CLI, not a daemon —
    # there is no reconciler/sync sidecar to run here. dir-apiserver stores
    # directly to dir-postgres + dir-zot on its own, so Push/Search work
    # without an additional reconciler process.

  agent-dir-init:
    build:
      context: ./agent-dir-init
      additional_contexts:
        dir_proto: ./proto
    image: cd-agent-dir-init
    container_name: cd-agent-dir-init
    depends_on:
      dir-apiserver:
        condition: service_started
    environment:
      DIR_APISERVER_URL: dir-apiserver:8888
    networks:
      - cd-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # identity-node-init — bootstraps the identity-node issuer settings
  # ---------------------------------------------------------------------------
  identity-node-init:
    image: python:3.12-slim
    container_name: cd-identity-node-init
    entrypoint: python /init.py
    depends_on:
      identity-node:
        condition: service_healthy
      identity-vault:
        condition: service_healthy
    environment:
      IDENTITY_NODE_URL: http://identity-node:4000
      VAULT_ADDR: http://identity-vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      # Each org gets its own Vault Transit key and registers as its own
      # trust authority — org-a attests Org A agents, org-b Org B agents.
      ISSUERS: org-a-issuer:org-a,org-b-issuer:org-b
    volumes:
      - ./identity-node-init.py:/init.py:ro
    networks:
      - cd-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # Demo webapp — animated sequence diagram UI
  # ---------------------------------------------------------------------------
  webapp:
    build:
      context: ./webapp
      additional_contexts:
        dir_proto: ./proto
        shared_lib: ./agntcy_identity_client
    image: cd-webapp
    container_name: cd-webapp
    depends_on:
      keycloak-a:
        condition: service_healthy
      keycloak-b:
        condition: service_healthy
      idjag-issuer:
        condition: service_healthy
      identity-node:
        condition: service_healthy
      identity-vault:
        condition: service_healthy
      identity-node-init:
        condition: service_completed_successfully
      dir-apiserver:
        condition: service_started
      envoy-org-b:
        condition: service_healthy
      envoy-org-a:
        condition: service_healthy
      vc-issuer:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    ports:
      - "${WEBAPP_PORT:-8090}:8090"
    environment:
      KC_A_URL: ${KC_A_INTERNAL_URL:-http://keycloak-a:8080}
      KC_A_REALM: org-a
      KC_B_URL: ${KC_B_INTERNAL_URL:-http://keycloak-b:8080}
      KC_B_REALM: org-b
      OPENCODE_CLIENT_ID: opencode-agent
      OPENCODE_CLIENT_SECRET: ${OPENCODE_CLIENT_SECRET:-demo-opencode-secret-change-me}
      TRIAGE_CLIENT_ID: triage-agent
      TRIAGE_CLIENT_SECRET: ${TRIAGE_CLIENT_SECRET:-demo-triage-secret-change-me}
      SARAH_USER: ${SARAH_USER:-sarah}
      SARAH_PASSWORD: ${SARAH_PASSWORD:?set SARAH_PASSWORD in .env}
      SARAH_EMAIL: ${SARAH_EMAIL:-sarah@org-a.example}
      IDJAG_ISSUER_URL: http://idjag-issuer:9000
      IDENTITY_NODE_URL: http://identity-node:4000
      VC_ISSUER_URL: http://vc-issuer:9003
      EGRESS_PDP_URL: http://envoy-org-a:12000
      TRIAGE_AGENT_URL: http://envoy-org-b:10000
      DIR_APISERVER_URL: dir-apiserver:8888
      VAULT_ADDR: http://identity-vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      VAULT_KEY_NAME: org-a-issuer
      ORG_A_COMMON_NAME: org-a
      SCAN_REPO: ${SCAN_REPO:-demo-admin/payments-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      JAEGER_UI_URL: ${JAEGER_UI_URL:-}
      # Public reference links shown in the webapp's "Access these services"
      # legend — blank hides each entry. Independent of KC_A_URL/KC_B_URL
      # above (those are for internal token calls; these are for a human
      # clicking through in a browser).
      GITEA_UI_URL: ${GITEA_UI_URL:-}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-demo-admin}
      KC_A_UI_URL: ${KC_A_UI_URL:-}
      KC_B_UI_URL: ${KC_B_UI_URL:-}
    networks:
      - cd-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  cd-net:
    driver: bridge
  resource-net:
    driver: bridge
    internal: true

volumes:
  cd-gitea-data:
  cd-identity-postgres-data:
  cd-dir-postgres-data:
  cd-dir-zot-data:
