# TLS termination only. Identity Node performs all identity and VC operations.
events {}
http {
  server {
    listen 8443 ssl;
    server_name identity-node-tls;
    ssl_certificate /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location / {
      proxy_pass http://identity-node:4000;
      proxy_set_header Host $host;
      proxy_read_timeout 15s;
    }
  }
}
