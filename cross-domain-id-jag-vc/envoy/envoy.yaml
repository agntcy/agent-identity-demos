admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: org_b_ticket_ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: org_b_ticket_ingress
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          start_time: "%START_TIME%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          duration_ms: "%DURATION%"
                route_config:
                  name: org_b_ticket_routes
                  virtual_hosts:
                    - name: triage_agent
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: triage_agent
                            timeout: 90s
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      # The /keycloak-b path segment below is baked in at build
                      # time to match KC_B_RELATIVE_PATH on the keycloak-b
                      # service (docker-compose.yaml) — Keycloak's own
                      # --http-relative-path setting, used to reverse-proxy its
                      # UI under a subpath. Keep both in sync.
                      providers:
                        org_b_access_token:
                          issuer: http://keycloak-b:8080/keycloak-b/realms/org-b
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak-b:8080/keycloak-b/realms/org-b/protocol/openid-connect/certs
                              cluster: keycloak_b_jwks
                              timeout: 5s
                            cache_duration: 300s
                          forward: true
                          forward_payload_header: x-verified-access-token-payload
                        idjag_actor_token:
                          issuer: http://idjag-issuer:9000
                          audiences:
                            - http://keycloak-b:8080/keycloak-b/realms/org-b
                          from_headers:
                            - name: X-AGNTCY-Actor-Token
                              value_prefix: "Bearer "
                          remote_jwks:
                            http_uri:
                              uri: http://idjag-issuer:9000/jwks
                              cluster: idjag_issuer_jwks
                              timeout: 5s
                            cache_duration: 300s
                          forward: false
                          forward_payload_header: x-verified-actor-token-payload
                      rules:
                        - match:
                            path: "/health"
                        - match:
                            prefix: "/"
                          requires:
                            requires_all:
                              requirements:
                                - provider_name: org_b_access_token
                                - provider_name: idjag_actor_token
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 65536
                  - name: io.builtonenvoy.opa
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: composer
                      filter_name: opa
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"policies":[{"file":"/etc/envoy/policies/ticket-ingress.rego"}],"with_body":true,"fail_open":false}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: org_b_resource_access
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: org_b_resource_access
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          start_time: "%START_TIME%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          duration_ms: "%DURATION%"
                route_config:
                  name: org_b_resource_routes
                  virtual_hosts:
                    - name: gitea_gateway
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: gitea_gateway
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        org_b_resource_token:
                          issuer: http://keycloak-b:8080/keycloak-b/realms/org-b
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak-b:8080/keycloak-b/realms/org-b/protocol/openid-connect/certs
                              cluster: keycloak_b_jwks
                              timeout: 5s
                            cache_duration: 300s
                          forward: true
                          forward_payload_header: x-verified-access-token-payload
                        idjag_sub_badge:
                          issuer: http://idjag-issuer:9000
                          audiences:
                            - http://keycloak-b:8080/keycloak-b/realms/org-b
                          from_headers:
                            - name: X-AGNTCY-Actor-Token
                              value_prefix: "Bearer "
                          remote_jwks:
                            http_uri:
                              uri: http://idjag-issuer:9000/jwks
                              cluster: idjag_issuer_jwks
                              timeout: 5s
                            cache_duration: 300s
                          forward: false
                          forward_payload_header: x-verified-actor-token-payload
                      rules:
                        - match:
                            path: "/healthz"
                        - match:
                            prefix: "/"
                          requires:
                            requires_all:
                              requirements:
                                - provider_name: org_b_resource_token
                                - provider_name: idjag_sub_badge
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 65536
                  - name: io.builtonenvoy.opa
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: composer
                      filter_name: opa
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"policies":[{"file":"/etc/envoy/policies/resource-access.rego"}],"with_body":true,"fail_open":false}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: keycloak_b_jwks
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: keycloak_b_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: keycloak-b
                      port_value: 8080

    - name: idjag_issuer_jwks
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: idjag_issuer_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: idjag-issuer
                      port_value: 9000

    - name: triage_agent
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: triage_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: triage-agent
                      port_value: 8200

    - name: gitea_gateway
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: gitea_gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: gitea-gateway
                      port_value: 9100
